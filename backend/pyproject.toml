[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rovexquant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "httpx>=0.27,<1", "cryptography>=50.0.0,<51", "protobuf>=4.25,<6", "websockets>=13,<16", "psycopg[binary]>=3.2,<4", "jsonschema>=4.23,<5", "alembic>=1.20,<2", "sqlalchemy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL database"]
[tool.ruff]
line-length = 100
target-version = "py311"
