name: Quant Autonomous EOD Ingestion

on:
  schedule:
    # 04:30 UTC = 10:00 IST. Runs after TejHQ says data is usually ready next morning; best-effort only.
    - cron: "30 4 * * 1-5"
  workflow_dispatch:
    inputs:
      exchange:
        description: Exchange to collect
        required: true
        default: both
        type: choice
        options: [nse, bse, both]

permissions:
  contents: read

concurrency:
  group: quant-eod-ingestion
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and persist TejHQ EOD snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUANT_ENV: production
      QUANT_TOKEN_DATABASE_URL: ${{ secrets.QUANT_TOKEN_DATABASE_URL }}
      QUANT_MARKET_DATABASE_URL: ${{ secrets.QUANT_MARKET_DATABASE_URL }}
      QUANT_TOKEN_MIGRATION_DATABASE_URL: ${{ secrets.QUANT_TOKEN_MIGRATION_DATABASE_URL }}
      TEJHQ_API_KEY: ${{ secrets.TEJHQ_API_KEY }}
    steps:
      - name: Checkout Quant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install exact locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check "uv==0.12.9"
          uv pip install --system --no-deps -r requirements.lock
          uv pip install --system --no-deps -e .
      - name: Validate database configuration
        id: config
        shell: bash
        run: |
          if [[ -z "${QUANT_TOKEN_DATABASE_URL}" && -z "${QUANT_MARKET_DATABASE_URL}" ]]; then
            echo "::error::EOD collection is blocked: configure QUANT_TOKEN_DATABASE_URL or QUANT_MARKET_DATABASE_URL."
            exit 1
          fi
          if [[ -z "${QUANT_TOKEN_MIGRATION_DATABASE_URL}" ]]; then
            echo "::error::EOD collection is blocked: configure QUANT_TOKEN_MIGRATION_DATABASE_URL with the direct PostgreSQL endpoint."
            exit 1
          fi
          echo "Database configuration present; migration and ingestion will be required."
      - name: Apply reviewed PostgreSQL migrations
        working-directory: backend
        run: alembic -c alembic.ini upgrade head
      - name: Collect and persist EOD snapshot
        working-directory: backend
        env:
          EXCHANGE: ${{ github.event.inputs.exchange || 'both' }}
        run: python scripts/collect_eod_snapshot.py --exchange "$EXCHANGE"
