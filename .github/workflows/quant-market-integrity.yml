name: Quant Historical Backfill & Exchange Reconciliation

on:
  schedule:
    # 19:30 IST and a 21:30 IST retry; repeated reports are content-hash idempotent.
    - cron: "0 14 * * 1-5"
    - cron: "0 16 * * 1-5"
  workflow_dispatch:
    inputs:
      operation:
        description: Run official reconciliation or import one historical Parquet year
        required: true
        default: reconcile
        type: choice
        options: [reconcile, backfill]
      exchange:
        description: Exchange for manual operation
        required: true
        default: nse
        type: choice
        options: [nse, bse]
      year:
        description: Calendar year for historical backfill
        required: false
        default: "2026"
        type: string
      trading_date:
        description: ISO trading date for reconciliation; blank uses today's India date
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: quant-market-integrity-\${{ github.event_name == 'schedule' && github.event.schedule || inputs.operation }}
  cancel-in-progress: false

jobs:
  integrity:
    name: Historical backfill / official exchange reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QUANT_ENV: production
      QUANT_TOKEN_DATABASE_URL: \${{ secrets.QUANT_TOKEN_DATABASE_URL }}
      QUANT_MARKET_DATABASE_URL: \${{ secrets.QUANT_MARKET_DATABASE_URL }}
      QUANT_TOKEN_MIGRATION_DATABASE_URL: \${{ secrets.QUANT_TOKEN_MIGRATION_DATABASE_URL }}
      QUANT_MARKET_MIGRATION_DATABASE_URL: \${{ secrets.QUANT_MARKET_MIGRATION_DATABASE_URL }}
    steps:
      - name: Checkout Quant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install exact backend lock and isolated Parquet reader
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check "uv==0.12.9"
          uv pip install --system --no-deps -r requirements.lock
          uv pip install --system --no-deps -e .
          python -m pip install --disable-pip-version-check "duckdb==1.5.6"
      - name: Validate database configuration and apply reviewed migrations
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "\${QUANT_MARKET_DATABASE_URL:-}" && -z "\${QUANT_TOKEN_DATABASE_URL:-}" ]]; then
            echo "::error::Configure QUANT_MARKET_DATABASE_URL or QUANT_TOKEN_DATABASE_URL."
            exit 1
          fi
          MIGRATION_URL="\${QUANT_MARKET_MIGRATION_DATABASE_URL:-\${QUANT_TOKEN_MIGRATION_DATABASE_URL:-}}"
          if [[ -z "$MIGRATION_URL" ]]; then
            echo "::error::Configure QUANT_MARKET_MIGRATION_DATABASE_URL (or QUANT_TOKEN_MIGRATION_DATABASE_URL for a shared DB)."
            exit 1
          fi
          QUANT_TOKEN_MIGRATION_DATABASE_URL="$MIGRATION_URL" alembic -c alembic.ini upgrade head
      - name: Import selected historical year
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'backfill'
        working-directory: backend
        run: |
          python scripts/backfill_hf_parquet.py --exchange "\${{ inputs.exchange }}" --year "\${{ inputs.year }}"
      - name: Reconcile official NSE and BSE reports
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'reconcile')
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ "\${{ github.event_name }}" == "schedule" ]]; then
            TRADING_DATE="$(TZ=Asia/Kolkata date +%F)"
            EXCHANGES=(nse bse)
          else
            TRADING_DATE="\${{ inputs.trading_date }}"
            if [[ -z "$TRADING_DATE" ]]; then TRADING_DATE="$(TZ=Asia/Kolkata date +%F)"; fi
            EXCHANGES=("\${{ inputs.exchange }}")
          fi
          python -c 'from datetime import date; import sys; date.fromisoformat(sys.argv[1])' "$TRADING_DATE"
          for EXCHANGE in "\${EXCHANGES[@]}"; do
            python scripts/reconcile_official_bhavcopy.py --exchange "$EXCHANGE" --date "$TRADING_DATE"
          done
